{{- $s := .ctx.Site.Params.social -}}
{{- $z := .size | default 24 -}}
{{- $pad := .pad | default "" -}}
{{ with $s.whatsapp }}
<a href="{{ . }}" target="_blank" rel="noopener" aria-label="WhatsApp" class="social-link" {{ with $pad }}style="padding: {{ . }};"{{ end }}>
  <svg viewBox="0 0 24 24" width="{{ $z }}" height="{{ $z }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
</a>
{{ end }}
{{ with $s.telegram }}
<a href="{{ . }}" target="_blank" rel="noopener" aria-label="Telegram" class="social-link" {{ with $pad }}style="padding: {{ . }};"{{ end }}>
  <svg viewBox="0 0 24 24" width="{{ $z }}" height="{{ $z }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
</a>
{{ end }}
{{ with $s.instagram }}
<a href="{{ . }}" target="_blank" rel="noopener" aria-label="Instagram" class="social-link" {{ with $pad }}style="padding: {{ . }};"{{ end }}>
  <svg viewBox="0 0 24 24" width="{{ $z }}" height="{{ $z }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
</a>
{{ end }}
{{ with $s.x }}
<a href="{{ . }}" target="_blank" rel="noopener" aria-label="X" class="social-link" {{ with $pad }}style="padding: {{ . }};"{{ end }}>
  <svg viewBox="0 0 24 24" width="{{ sub $z 2 }}" height="{{ sub $z 2 }}" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
</a>
{{ end }}
